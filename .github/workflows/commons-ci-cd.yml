# Nome que aparece na aba "Actions" do GitHub
name: CI - Commons Library

# ─── TRIGGERS ────────────────────────────────────────────────
on:
  push:
    branches: [main]   # roda quando é push nessa
  pull_request:
    branches: [main]            # roda quando abre PR ou faz novo commit dentro do PR com destino à main
  workflow_dispatch:            # adiciona botão "Run workflow" na UI do GitHub (para testes manuais)

# ─── JOBS ────────────────────────────────────────────────────
jobs:

  build-and-publish:            # nome do job
    runs-on: ubuntu-latest      # GitHub sobe uma VM Linux limpa para este job

    steps:

      # ── Passo 1 ──────────────────────────────────────────
      - name: Fazer checkout do código
        uses: actions/checkout@v4
        # baixa o código do repositório commons dentro da VM
        # sem isso a VM não teria acesso a nenhum arquivo do projeto

      # ── Passo 2 ──────────────────────────────────────────
      - name: Configurar o Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'          # versão do Java que o projeto usa
          distribution: 'temurin'     # distribuição do JDK
          server-id: github           # id que bate com o <id> do distributionManagement no pom.xml
          server-username: MAVEN_USERNAME   # nome da variável de ambiente que terá o username
          server-password: MAVEN_PASSWORD   # nome da variável de ambiente que terá o token
        # além de instalar o JDK, esta action gera o settings.xml na VM
        # com as credenciais necessárias para publicar no GitHub Packages

      # ── Passo 3 ──────────────────────────────────────────
      - name: Cache das dependências Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          # ~/.m2 é onde o Maven guarda os JARs baixados localmente
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          # se o pom.xml não mudou, o cache é reaproveitado — build mais rápido
          restore-keys: |
            ${{ runner.os }}-maven-
          # fallback: se não achar o cache exato, tenta um cache parcial anterior

      # ── Passo 4 ──────────────────────────────────────────
      - name: Dar permissão de execução ao Maven Wrapper
        run: chmod +x ./mvnw
        # concede permissão de execução ao mvnw
        # necessário pois o Git nem sempre preserva permissões ao commitar do Windows

      # ── Passo 5 ──────────────────────────────────────────
      - name: Compilar o projeto
        run: ./mvnw compile -B
        # compila os arquivos .java e gera os .class
        # -B (batch mode) — logs mais limpos, ideal para CI

      # ── Passo 6 ──────────────────────────────────────────
      - name: Rodar os testes
        run: ./mvnw test -B
        # executa todos os testes da pasta src/test/
        # se qualquer teste falhar, o job para aqui e marca como falha

      # ── Passo 7 ──────────────────────────────────────────
      - name: Publicar no GitHub Packages
        run: ./mvnw deploy -B -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        # deploy — compila, empacota e publica a biblioteca no GitHub Packages
        # -DskipTests — pula os testes pois já rodamos no passo anterior
        # GITHUB_TOKEN é um secret automático que o GitHub injeta em todo workflow
        # ele já tem permissão de escrita no GitHub Packages do próprio repositório
        # por isso não precisa criar secrets manuais como foi necessário no pay
        # a publicação só acontece quando a condição do passo seguinte for satisfeita

      # ── Passo 8 ──────────────────────────────────────────
      - name: Publicar o JAR como artefato
        uses: actions/upload-artifact@v4
        with:
          name: commons-jar                  # nome que vai aparecer no GitHub
          path: target/*.jar                 # a biblioteca está na raiz, não em subpasta
          retention-days: 7                  # GitHub guarda por 7 dias, depois apaga
        # permite baixar o JAR gerado diretamente pela aba Actions do GitHub
        # útil para inspecionar o build sem precisar rodar localmente